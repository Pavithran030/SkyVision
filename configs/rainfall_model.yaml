# Rainfall Model Configuration
prediction_horizon: "next_1_hour"

# Bins defined on 1-hour accumulated precipitation in mm
bins:
  - name: "no_measurable_rain"
    min_mm: 0.0
    max_mm: 0.1
  - name: "light"
    min_mm: 0.1
    max_mm: 2.5
  - name: "moderate"
    min_mm: 2.5
    max_mm: 7.5
  - name: "heavy"
    min_mm: 7.5
    max_mm: 9999.0

label_sources:
  preferred: "rain_gauge"
  proxy: "open_meteo_historical_reanalysis"

models:
  baseline: "majority_class_and_median"
  image_embedding_classifier: "random_forest"
  image_embedding_regressor: "random_forest"
  multimodal_classifier: "random_forest"

features:
  multimodal:
    - "temperature_2m"
    - "relative_humidity_2m"
    - "surface_pressure"
    - "wind_speed_10m"

evaluation:
  random_seed: 42
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
