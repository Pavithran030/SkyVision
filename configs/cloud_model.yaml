# Cloud Pattern Recognition Model Configuration
model:
  backbone: "mobilenet_v3_small" # Lightweight CNN ideal for local deployment
  pretrained: true
  image_size: 224
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  default_classes:
    - "clear_sky"
    - "patterned_clouds"
    - "thick_dark_clouds"
    - "thick_white_clouds"
    - "veil_clouds"

training:
  batch_size: 16
  epochs: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  random_seed: 42
  num_workers: 0
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15

validation_checks:
  min_width: 64
  min_height: 64
  min_mean_intensity: 15.0 # Check for pitch-black corrupted images
  max_mean_intensity: 245.0 # Check for completely washed-out white frames
